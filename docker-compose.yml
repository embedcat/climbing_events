version: '3.8'

services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/
    environment:
      - POSTGRES_DB=climbing_events
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-development-key-12345
      - DATABASE_URL=postgres://postgres:postgres@db:5432/climbing_events
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - USE_DJDT=False
      - DEFAULT_EVENT_ID=0
      - DEFAULT_FROM_EMAIL=noreply@localhost
      - EMAIL_HOST_USER=dev@localhost
      - EMAIL_HOST_PASSWORD=dev-placeholder
      # Vue-экраны грузятся с dev-сервера Vite (сервис frontend), а не из сборки
      - VITE_DEV_SERVER=http://localhost:5173
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      # на bind-mount из Windows события файловой системы не доходят, Vite следит за файлами опросом
      - VITE_POLLING=1
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
